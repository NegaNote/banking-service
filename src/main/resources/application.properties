# Server
server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://banking-db:3306/bankdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=True
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.flyway.migrations=classpath:db/migration

# JWT settings
# Generate a real secret with: openssl rand -base64 64
# DO NOT use this value in production
app.jwt.secret=IZXYHmwcMmRNoLh+Vv6aE9n0m6667FPpzAr1v99R6ZErGpF9s5bI1WLlMnykCvV5BdsW9IP07t2frm6C+TQJdg==
app.jwt.expiration-ms=3600000

# Logging
logging.level.org.springframework.security=DEBUG